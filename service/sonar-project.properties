sonar.projectKey=s-erp-api
sonar.projectName=s-erp-api service
sonar.sources=.
sonar.exclusions=**/vendor/**,**/*_test.go,**/mocks/**,**/internal/database/migrations/**

# Tests + coverage. Regenerate the report with:
#   go test ./internal/... -coverprofile=coverage.out -covermode=count
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.go.coverage.reportPaths=coverage.out
