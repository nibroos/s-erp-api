<!DOCTYPE html>
<html>

<head>
	<title>{{.Subject}}</title>
	<!-- cdn tailwind -->
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
	<div>
		<h1 class="text-rose-600">Hello Mr.{{.CustomerName}}!</h1>
		<!-- Use inline styles with proper quoting -->
		<p>{{.Message}}</p>

		{{if .ButtonURL}}
		<a href="{{.ButtonURL}}" class="bg-rose-900">
			{{.ButtonText}}
		</a>
		{{end}}

		<p class="footer">Sent at: {{.SentAt}}</p>
	</div>
</body>

</html>
