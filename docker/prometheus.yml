global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'go-fiber-app'
    static_configs:
      - targets: ['service:9090']  # Replace with your Go Fiber app's service name and port

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']  # PostgreSQL Exporter metrics