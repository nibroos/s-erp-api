volumes:
  postgres-s-erp-api:
  public-s-erp-api:
  grafana-storage:
  # jaeger-logs:
  # elasticsearch-data moved to the s-erp-elk project.
  rabbitmq-data:
  minio-s-erp-api:

networks:
  s-erp-api-network:
    driver: bridge
  # Standalone s-erp-redis cache (its own project owns this network).
  s-erp-redis-network:
    external: true
    name: s-erp-redis-network
