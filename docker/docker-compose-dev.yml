  postgres-exporter:
    image: bitnami/postgres-exporter:0.16.0
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - s-erp-api-network
    depends_on:
      - postgres
    # restart: on-failure

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    expose:
      - 9100
    networks:
      - s-erp-api-network

  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - s-erp-api-network
    depends_on:
      - postgres-exporter
    restart: on-failure

  grafana:
    image: grafana/grafana:11.5.1
    ports:
      - "3005:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - s-erp-api-network
    depends_on:
      - prometheus
    environment:
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    # restart: on-failure

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.10.0
    networks:
      - s-erp-api-network
    environment:
      - discovery.type=single-node  # Run in single-node mode
      - ES_JAVA_OPTS=-Xms128m -Xmx256m  # Set min heap to 128MB and max heap to 256MB
      - xpack.ml.enabled=false  # Disable machine learning
      - xpack.security.enabled=false  # Disable security
      - xpack.monitoring.enabled=false  # Disable monitoring
      - xpack.watcher.enabled=false  # Disable watcher (alerting)
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.56
    ports:
      - 16686:16686  # Jaeger UI
      - 14268:14268  # HTTP collector
      - 4317:4317  # OTLP gRPC
      - 4318:4318  # OTLP HTTP
    networks:
      - s-erp-api-network
    environment:
      - SPAN_STORAGE_TYPE=elasticsearch  # Use Elasticsearch as the storage backend
      - ES_SERVER_URLS=http://elasticsearch:9200  # Elasticsearch server address
      - ES_TTL=168h  # Set TTL to 7 days (optional)
    depends_on:
      elasticsearch:
        condition: service_healthy

