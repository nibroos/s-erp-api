volumes:
  postgres-s-erp-api:
  grafana-storage:
  # jaeger-logs:
  # elasticsearch-data moved to the s-erp-elk project.
  rabbitmq-data:
  minio-s-erp-api:

networks:
  s-erp-api-network:
    driver: bridge
  # Standalone s-erp-redis cache (its own project owns this network).
  s-erp-redis-network:
    external: true
    name: s-erp-redis-network
  # Standalone Ollama stack (its own project owns this network). Joining it is
  # how the service reaches the model as `ollama:11434` — the container only
  # publishes 127.0.0.1:11434 on the host, which is unreachable from here.
  localai-network:
    external: true
    name: localai_default
