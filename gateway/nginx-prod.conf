# splitted configuration to specific domain
server {
    listen 80;
    server_name api-s-erp-api-service.nibros.tech;

    #Route gRPC requests
    location /grpc/users {
        grpc_pass grpc://s-erp-api-service-grpc;
    }

    # Route REST API requests
    location /api/v1/users {
        proxy_pass http://s-erp-api-service-rest;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chat websocket endpoint (protocol upgrade). Attachments upload goes over
    # the normal REST proxy above; presigned download/view URLs are served by
    # the storage server block below.
    location /api/v1/chats/ws {
        proxy_pass http://s-erp-api-service-rest;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /error502grpc {
        internal;
        default_type application/grpc;
        add_header grpc-status 14;
        add_header content-length 0;
        return 204;
    }
}

# Object storage: browser-facing host for presigned attachment URLs. Set
# MINIO_PUBLIC_ENDPOINT (and MINIO_PUBLIC_USE_SSL) on the service to match this
# server_name so presigned-URL signatures validate. Host is passed through
# unchanged (MinIO verifies the signature against it). Terminate TLS here.
server {
    listen 80;
    server_name storage-s-erp-api-service.nibros.tech;

    client_max_body_size 60m;

    location / {
        proxy_pass http://s-erp-api-minio;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# upstream configuration to load balance
http {
    upstream s-erp-api-service-grpc {
        server 127.0.0.1:50051;
        server 127.0.0.1:50052;
        server 127.0.0.1:50053;
    }

    upstream s-erp-api-service-rest {
        server 127.0.0.1:4001;
        server 127.0.0.1:4002;
        server 127.0.0.1:4003;
    }

    upstream s-erp-api-minio {
        server minio:9000;
    }
}