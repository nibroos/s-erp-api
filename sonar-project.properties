# ─────────────────────────────────────────────────────────────────────────────
# SonarQube analysis for s-erp-api.
# Run by the pipeline on pull requests and on main.
# ─────────────────────────────────────────────────────────────────────────────
sonar.projectKey=s-erp-api
sonar.projectName=s-erp-api

sonar.sources=service
sonar.tests=service
sonar.test.inclusions=**/*_test.go
sonar.sourceEncoding=UTF-8

# Declare the SCM explicitly. Autodetection fails in a Jenkins multibranch
# workspace and warns:
#   "SCM provider autodetection failed. Please use sonar.scm.provider..."
# This is not cosmetic: without SCM blame data SonarQube cannot tell which lines
# a change touched, so new-code metrics and the new-code quality gate are
# computed against nothing.
sonar.scm.provider=git
# The Jenkins checkout is shallow-ish; let SonarQube read the full history it
# needs for blame rather than silently degrading.
sonar.scm.forceReloadAll=true

# Native Go profile, produced by .ci/test.sh. If that script does not run, this
# path does not exist and SonarQube reports Coverage as "Not computed" — which
# looks like a Sonar problem but is really a failed test stage upstream.
sonar.go.coverage.reportPaths=service/coverage.out

sonar.exclusions=\
  **/vendor/**,\
  **/*.pb.go,\
  **/*_generated.go,\
  **/mocks/**,\
  **/proto/**,\
  docker/**,\
  docs/**,\
  scripts/**

# Generated and vendored code must not count against coverage either, or the
# new-code number is diluted by files nobody wrote.
sonar.coverage.exclusions=\
  **/*_test.go,\
  **/mocks/**,\
  **/proto/**,\
  **/*.pb.go,\
  **/cmd/**

# NOTE: no sonar.newCode.referenceBranch — on a PR the scope comes from
# sonar.pullrequest.base, which the pipeline sets. Setting it to the main branch
# makes it self-referential when main itself is analysed. The project baseline
# is configured server-side (Project Settings > New Code).
